name: CI

# Quality gate: análise estática (golangci-lint + gosec) e scanner de
# vulnerabilidades (Trivy). Roda em PRs e é chamado pelo Deploy (workflow_call)
# como pré-requisito: só builda/deploya se o CI passar.
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint + gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint (inclui gosec)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  semgrep:
    name: Semgrep (multi-tenant)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep — regras de isolamento multi-tenant
        run: semgrep --config .semgrep/ --error
        env:
          SEMGREP_SEND_METRICS: "off"

  trivy:
    name: Trivy (deps + config + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
