# Regras Semgrep para reforçar o isolamento multi-tenant (seção 6 da spec).
# Complementa as RLS policies (migrations/0002_rls.sql): falha se uma query
# ad-hoc em Go acessar tabelas tenant-scoped sem filtrar por organization_id.
#
# Rodar: semgrep --config .semgrep/
# Nota: queries geradas pelo sqlc (em internal/db/generated/) são ignoradas — a
# garantia ali vem do .sql versionado em internal/db/queries/, revisado manualmente.
rules:
  - id: query-sem-organization-id
    languages: [go]
    severity: WARNING
    message: >
      Query em tabela tenant-scoped sem filtro explícito por organization_id.
      Toda leitura/escrita multi-tenant deve carregar organization_id (defense
      in depth sobre as RLS policies). Se for intencional, justifique no PR.
    paths:
      exclude:
        - /internal/db/generated/
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - pattern: $DB.Query($CTX, $QUERY, ...)
          - pattern: $DB.QueryRow($CTX, $QUERY, ...)
          - pattern: $DB.Exec($CTX, $QUERY, ...)
          - pattern: $DB.QueryContext($CTX, $QUERY, ...)
          - pattern: $DB.QueryRowContext($CTX, $QUERY, ...)
          - pattern: $DB.ExecContext($CTX, $QUERY, ...)
      - metavariable-pattern:
          metavariable: $QUERY
          language: generic
          patterns:
            - pattern-regex: '(?is)\b(?:select\b[\s\S]*?\bfrom\s+|update\s+|delete\s+from\s+)(?:"?[a-z_][a-z0-9_]*"?\.)?"?(?:patient_profile|appointment|clinical_note|organization_member)"?\b'
            - pattern-not-regex: '(?i)organization_id'
