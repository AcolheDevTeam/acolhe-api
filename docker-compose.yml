services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: acolhe
      POSTGRES_USER: acolhe
      POSTGRES_PASSWORD: acolhe
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
